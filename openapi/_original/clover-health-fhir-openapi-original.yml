  /providerdirectory/api/Organization:
    get:
      operationId: search_organization
      description: This interaction searches a set of resources based on some filter
        criteria.
      summary: This interaction searches a set of resources based on some filter criteria.
      parameters:
      - in: query
        name: _count
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          default: 20
          title: ' count'
        description: Maximum number of results to be returned
      - in: query
        name: _id
        schema:
          type: string
          title: ' id'
          minLength: 1
        description: Resource id (not a full URL)
      - in: query
        name: _include
        schema:
          enum:
          - Organization:partof
          - Organization:endpoint
          - Organization:coverage-area
          type: string
          title: ' include'
          minLength: 1
        description: |-
          Return resources related to the search results (E.g. Organization:partof, Organization:endpoint and Organization:coverage-area (Not effective))

          * `Organization:partof` - Organization:partof
          * `Organization:endpoint` - Organization:endpoint
          * `Organization:coverage-area` - Organization:coverage-area
      - in: query
        name: _offset
        schema:
          type: integer
          minimum: 0
          default: 0
          title: ' offset'
        description: Number of results to be offset
      - in: query
        name: _revinclude
        schema:
          enum:
          - Endpoint:organization
          - HealthcareService:organization
          - InsurancePlan:administered-by
          - InsurancePlan:owned-by
          - OrganizationAffiliation:primary-organization
          - OrganizationAffiliation:participating-organization
          - PractitionerRole:organization
          - PractitionerRole:network
          type: string
          title: ' revinclude'
          minLength: 1
        description: |-
          Return resources filtered by the search results (E.g. Endpoint:Organization, HealthcareService:organization, InsurancePlan:administered-by (Not effective), InsurancePlan:owned-by (Not effective), PractitionerRole:organization, PractitionerRole:network, OrganizationAffiliation:primary-organization, OrganizationAffiliation:participating-organization)

          * `Endpoint:organization` - Endpoint:organization
          * `HealthcareService:organization` - HealthcareService:organization
          * `InsurancePlan:administered-by` - InsurancePlan:administered-by
          * `InsurancePlan:owned-by` - InsurancePlan:owned-by
          * `OrganizationAffiliation:primary-organization` - OrganizationAffiliation:primary-organization
          * `OrganizationAffiliation:participating-organization` - OrganizationAffiliation:participating-organization
          * `PractitionerRole:organization` - PractitionerRole:organization
          * `PractitionerRole:network` - PractitionerRole:network
      - in: query
        name: address
        schema:
          type: string
          minLength: 1
        description: Select organizations with the specified address (matches any
          of the string elements of an address) (case insensitive)
      - in: query
        name: coverage-area
        schema:
          type: string
          minLength: 1
        description: (Not effective due to lack of data) Select health insurance provider
          networks available in a region described by the specified location
      - in: query
        name: endpoint
        schema:
          type: string
          minLength: 1
        description: Select organizations with the specified endpoint (in terms of
          endpoint ID)
      - in: query
        name: name
        schema:
          type: string
          minLength: 1
        description: Select organizations with the specified name (matches any of
          portion of the name) (case insensitive)
      - in: query
        name: partof
        schema:
          type: string
          minLength: 1
        description: Select organizations that are part of the organization (in terms
          of organization ID)
      - in: query
        name: type
        schema:
          type: string
          minLength: 1
        description: Select organizations of the specified type (E.g. fac, prvgrp,
          ins, ntwk)
