  /formulary/api/metadata:
    get:
      operationId: get_formulary_api_metadata
      description: Get the capability statement of the formulary API
      summary: Get the capability statement of the formulary API
      tags:
      - fhir-r4-formulary-api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FHIRCapabilityStatement'
              examples:
                JSONExample:
                  value:
                    resourceType: CapabilityStatement
                    id: usdf-server
                    text:
                      status: additional
                      div: '<div xmlns="http://www.w3.org/1999/xhtml"><h2 id="title">USDFServerCapabilityStatement</h2>
                        <p>This Section describes the expected capabilities of the
                        US Drug Formulary Server actor which is responsible for providing
                        responses to the queries submitted by the US Drug Formulary
                        Requestors. The complete list of FHIR profiles, RESTful operations,
                        and search parameters supported by US Drug Formulary Server
                        are defined. </p> <table> <tr> <td>Mode:</td> <td>SERVER</td>
                        </tr> <tr> <td>Description:</td> <td>The US Drug Formulary
                        Server **SHALL**: <ol> <li>Support the US Drug Formulary CoveragePlan
                        (List) and FormularyDrug (MedicationKnowledge) resource profile.</li>
                        <li>Implement the RESTful behavior according to the FHIR specification.</li>
                        <li>Return the following response classes: <ul> <li>(Status
                        400): invalid parameter</li> <li>(Status 401/4xx): unauthorized
                        request</li> <li>(Status 403): insufficient scope</li> <li>Status
                        404): unknown resource</li> <li>(Status 410): deleted resource</li>
                        </ul> </li>      <li>Support json source formats for all US
                        Drug Formulary interactions.</li> </ol> </td>     </tr>     <tr>     <td>    </td>     <td>
                        The US Drug Formulary  Server **SHOULD**: <ol> <li>Support
                        xml source formats for all US Drug Formulary interactions.</li>
                        </ol> </td></tr> <tr>     <td>    </td>     <td>The US Drug
                        Formulary Server supports the following transactions:     <ul>         <li>CoveragePlan
                        (List) Resource             <ul>                 <li>**SHALL**:
                        search-type, read,   </li>                 <li>**SHOULD**
                        : vread, history-instance</li>                  <li>**MAY**
                        : create, update, patch, delete, history-type</li>             </ul>         </li>         <li>FormularyDrug
                        (MedicationKnowledge) Resource             <ul>                 <li>**SHALL**:
                        search-type, read,   </li>                 <li>**SHOULD**
                        : vread, history-instance</li>                 <li>**MAY**
                        : create, update, patch, delete, history-type</li>             </ul>         </li>         </ul>   </td>
                        </tr> <tr>     <td>    </td>     <td>The US Drug Formulary
                        Server **SHALL** support the following searchParameters individually
                        and in combination:     <ul>          <li>FormularyDrug (MedicationKnowledge)
                        Resource             <ul>                 <li>DrugName </li>                 <li>DrugPlan
                        </li>                 <li>DrugTier </li>                 <li>code</li>             </ul>         </li>     </ul>     </td>
                        </tr> </table> </div>'
                    version: 1.0.0
                    status: active
                    date: '2020-01-08T00:00:00+10:00'
                    publisher: Clover Health
                    description: 'This Section describes the expected capabilities
                      of the US Drug Formulary Server actor which is responsible for
                      providing responses to the queries submitted by the US Drug
                      Formulary Requestors. The complete list of FHIR profiles, RESTful
                      operations, and search parameters supported by US Drug Formulary
                      Server are defined. '
                    kind: instance
                    software:
                      name: Clover Health FHIR R4 Formulary API
                      version: 4.2.0
                    implementation:
                      description: DaVinci PDex US Drug Formulary
                      url: https://build.fhir.org/ig/HL7/davinci-pdex-formulary/
                    fhirVersion: 4.0.1
                    format:
                    - application/fhir+xml
                    - application/fhir+json
                    rest:
                    - mode: server
