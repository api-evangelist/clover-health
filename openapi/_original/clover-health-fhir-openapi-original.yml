                                      <ul>
                                        <li>**SHALL**: search-type, read,   </li>
                                        <li>**SHOULD** : vread, history-instance</li>
                                        <li>**MAY** : create, update, patch, delete, history-type</li>
                                      </ul>
                                    </li>
                                    <li>
