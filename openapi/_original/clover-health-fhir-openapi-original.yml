components:
  schemas:
    BaseBundleLink:
      type: object
      properties:
        relation:
          type: string
        url:
          type: string
          description: Reference details for the link
      required:
      - relation
      - url
    BaseBundleMeta:
      type: object
      properties:
        lastUpdated:
          type: string
          format: date-time
      required:
      - lastUpdated
    BaseBundleSearch:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/SearchModeEnum'
      required:
      - mode
    BaseBundleSignature:
      type: object
      properties:
        when:
          type: string
          format: date-time
          description: When the signature was created
        who:
          type: string
          description: Who signed
        targetFormat:
          type: string
          description: The technical format of the signed resources
        sigFormat:
          type: string
          description: The technical format of the signature
        onBehalfOf:
          type: string
          description: The party represented
        type:
          type: array
          items: {}
          description: Indication of the reason the entity signed the object(s)
        data:
          type: string
          description: The actual signature content (XML DigSig. JWT, picture, etc.)
      required:
      - data
      - type
      - when
    BaseResourceMeta:
      type: object
      properties:
        lastUpdated:
          type: string
          format: date-time
          description: When the resource version last changed
        profile:
          type: array
          items: {}
          description: Profiles this resource claims to conform to
        versionId:
          type: string
          description: Version specific identifier
        source:
          type: string
          description: Identifies where the resource comes from
      required:
      - profile
    BaseResourceText:
      type: object
      properties:
        status:
          type: string
        div:
          type: string
      required:
      - div
      - status
    CodeEnum:
      enum:
      - read
      - vread
      - update
      - patch
      - delete
      - history-instance
      - history-type
      - create
      - search-type
      type: string
      description: |-
        * `read` - read
        * `vread` - vread
        * `update` - update
        * `patch` - patch
        * `delete` - delete
        * `history-instance` - history-instance
        * `history-type` - history-type
        * `create` - create
        * `search-type` - search-type
    CommonReference:
      type: object
      properties:
        reference:
          type: string
      required:
      - reference
    EndpointGetResponse:
      type: object
      properties:
        resourceType:
          type: string
        id:
          type: string
        meta:
          allOf:
          - $ref: '#/components/schemas/BaseResourceMeta'
          description: Metadata about the resource
        text:
          allOf:
          - $ref: '#/components/schemas/BaseResourceText'
          description: Text summary of the resource, for human interpretation
        status:
          $ref: '#/components/schemas/EndpointGetResponseStatusEnum'
        connectionType:
          allOf:
          - $ref: '#/components/schemas/FHIRCodeableConcept'
          description: Protocol/Profile/Standard to be used with this endpoint connection
        managingOrganization:
          allOf:
          - $ref: '#/components/schemas/CommonReference'
          description: Organization that manages this endpoint
        payloadType:
          allOf:
          - $ref: '#/components/schemas/FHIRCodeableConcept'
          description: The type of content that may be used at this endpoint (e.g.
            XDS Discharge summaries)
        address:
          type: string
          description: The technical base address for connecting to this endpoint
      required:
      - address
      - id
      - meta
      - resourceType
      - status
      - text
    EndpointGetResponseStatusEnum:
      enum:
      - active
      - suspended
      - error
      - 'off'
      - entered-in-error
      - test
      type: string
      description: |-
        * `active` - active
        * `suspended` - suspended
        * `error` - error
        * `off` - off
        * `entered-in-error` - entered-in-error
        * `test` - test
    EndpointSearchEntry:
      type: object
      properties:
        fullUrl:
          type: string
          description: URI for resource (e.g. the absolute URL server address, URI
            for UUID/OID, etc.)
        search:
          allOf:
          - $ref: '#/components/schemas/BaseBundleSearch'
          description: Search related information
        resource:
          allOf:
          - $ref: '#/components/schemas/EndpointGetResponse'
          description: A resource in the bundle
      required:
      - fullUrl
      - resource
      - search
    EndpointSearchResponse:
      type: object
      properties:
        resourceType:
          type: string
          description: Bundle
        id:
          type: string
          description: Logical id of this artifact
        meta:
          allOf:
          - $ref: '#/components/schemas/BaseBundleMeta'
          description: Metadata about the resource
        type:
          $ref: '#/components/schemas/TypeF76Enum'
        total:
          type: integer
          minimum: 0
          description: If search, the total number of matches
        link:
          type: array
          items:
            $ref: '#/components/schemas/BaseBundleLink'
          description: Links related to this Bundle
        timestamp:
