                      <CapabilityStatement xmlns="http://hl7.org/fhir">
                        <id value="usdf-server"/>
                        <text>
                          <status value="additional"/>
                          <div xmlns="http://www.w3.org/1999/xhtml">
                            <h2 id="title">USDFServerCapabilityStatement</h2>
                            <p>This Section describes the expected capabilities of the US Drug Formulary Server actor which is responsible for providing responses to the queries submitted by the US Drug Formulary Requestors. The complete list of FHIR profiles, RESTful operations, and search parameters supported by US Drug Formulary Server are defined. </p>
                            <table>
                              <tr>
                                <td>Mode:</td>
                                <td>SERVER</td>
                              </tr>
                              <tr>
                                <td>Description:</td>
                                <td>
                                  The US Drug Formulary Server **SHALL**:
                                  <ol>
                                    <li>Support the US Drug Formulary CoveragePlan (List) and FormularyDrug (MedicationKnowledge) resource profile.</li>
                                    <li>Implement the RESTful behavior according to the FHIR specification.</li>
                                    <li>
                                      Return the following response classes:
                                      <ul>
                                        <li>(Status 400): invalid parameter</li>
                                        <li>(Status 401/4xx): unauthorized request</li>
                                        <li>(Status 403): insufficient scope</li>
                                        <li>Status 404): unknown resource</li>
                                        <li>(Status 410): deleted resource</li>
                                      </ul>
                                    </li>
                                    <li>Support json source formats for all US Drug Formulary interactions.</li>
                                  </ol>
                                </td>
                              </tr>
                              <tr>
                                <td>
                                </td>
                                <td>
                                   The US Drug Formulary  Server **SHOULD**:
                                  <ol>
                                    <li>Support xml source formats for all US Drug Formulary interactions.</li>
                                  </ol>
                                </td>
                              </tr>
                              <tr>
                                <td>
                                </td>
                                <td>
                                  The US Drug Formulary Server supports the following transactions:
