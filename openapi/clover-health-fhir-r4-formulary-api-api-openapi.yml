                    The API file specifies body for this request but it does not specify the data model.'
            application/fhir+xml:
              schema:
                $ref: '#/components/schemas/FHIRCapabilityStatement'
              examples:
                XMLExample:
                  value: "<?xml version='1.0' encoding='utf-8'?>\n  <CapabilityStatement xmlns=\"http://hl7.org/fhir\">\n    <id value=\"usdf-server\"/>\n    <text>\n      <status value=\"additional\"/>\n      <div xmlns=\"http://www.w3.org/1999/xhtml\">\n        <h2 id=\"title\">USDFServerCapabilityStatement</h2>\n        <p>This Section describes the expected capabilities of the US Drug Formulary Server actor which is responsible for providing responses to the queries submitted by the US Drug Formulary Requestors. The complete list of FHIR profiles, RESTful operations, and search parameters supported by US Drug Formulary Server are defined. </p>\n        <table>\n          <tr>\n            <td>Mode:</td>\n            <td>SERVER</td>\n          </tr>\n          <tr>\n            <td>Description:</td>\n            <td>\n              The US Drug Formulary Server **SHALL**:\n              <ol>\n                <li>Support the US Drug Formulary CoveragePlan (List) and FormularyDrug (MedicationKnowledge) resource profile.</li>\n                <li>Implement the RESTful behavior according to the FHIR specification.</li>\n                <li>\n                  Return the following response classes:\n                  <ul>\n                    <li>(Status 400): invalid parameter</li>\n                    <li>(Status 401/4xx): unauthorized request</li>\n                    <li>(Status 403): insufficient scope</li>\n                    <li>Status 404): unknown resource</li>\n                    <li>(Status 410): deleted resource</li>\n                  </ul>\n                </li>\n                <li>Support json source formats for all US Drug Formulary interactions.</li>\n              </ol>\n            </td>\n          </tr>\n          <tr>\n            <td>\n            </td>\n            <td>\n               The US Drug Formulary  Server **SHOULD**:\n              <ol>\n                <li>Support xml source formats for all US Drug Formulary interactions.</li>\n              </ol>\n            </td>\n          </tr>\n          <tr>\n            <td>\n            </td>\n            <td>\n              The US Drug Formulary Server supports the following transactions:\n              <ul>\n                <li>\n                  CoveragePlan (List) Resource\n                  <ul>\n                    <li>**SHALL**: search-type, read,   </li>\n                    <li>**SHOULD** : vread, history-instance</li>\n                    <li>**MAY** : create, update, patch, delete, history-type</li>\n                  </ul>\n                </li>\n                <li>\n                  FormularyDrug (MedicationKnowledge) Resource\n                  <ul>\n                    <li>**SHALL**: search-type, read,   </li>\n                    <li>**SHOULD** : vread, history-instance</li>\n                    <li>**MAY** : create, update, patch, delete, history-type</li>\n                  </ul>\n                </li>\n              </ul>\n            </td>\n          </tr>\n          <tr>\n            <td>\n            </td>\n            <td>\n              The US Drug Formulary Server **SHALL** support the following searchParameters individually and in combination:\n              <ul>\n                <li>\n                  FormularyDrug (MedicationKnowledge) Resource\n                  <ul>\n                    <li>DrugName </li>\n                    <li>DrugPlan </li>\n                    <li>DrugTier </li>\n                    <li>code</li>\n                  </ul>\n                </li>\n              </ul>\n            </td>\n          </tr>\n        </table>\n      </div>\n    </text>\n    <version value=\"1.0.0\"/>\n    <status value=\"active\"/>\n    <date value=\"2020-01-08T00:00:00+10:00\"/>\n    <publisher value=\"Clover Health\"/>\n    <description value=\"This Section describes the expected capabilities of the US Drug Formulary Server actor which is responsible for providing responses to the queries submitted by the US Drug Formulary Requestors. The complete list of FHIR profiles, RESTful operations, and search parameters supported by US Drug Formulary Server are defined. \"/>\n    <kind value=\"instance\"/>\n    <software>\n      <name value=\"Clover Health FHIR R4 Formulary API\"/>\n      <version value=\"4.2.0\"/>\n    </software>\n    <implementation>\n      <description value=\"DaVinci PDex US Drug Formulary\"/>\n      <url value=\"https://build.fhir.org/ig/HL7/davinci-pdex-formulary/\"/>\n    </implementation>\n    <fhirVersion value=\"4.0.1\"/>\n    <format value=\"application/fhir+xml\"/>\n    <format value=\"application/fhir+json\"/>\n    <rest>\n      <mode value=\"server\"/>\n      <resource>\n        <type value=\"Bundle\"/>\n        <profile value=\"http://hl7.org/fhir/StructureDefinition/Bundle\"/>\n        <interaction>\n          <code value=\"read\"/>\n        </interaction>\n      </resource>\n      <resource>\n        <type value=\"List\"/>\n        <profile value=\"http://hl7.org/fhir/us/davinci-drug-formulary/StructureDefinition/usdf-CoveragePlan\"/>\n        <interaction>\n          <code value=\"read\"/>\n        </interaction>\n        <interaction>\n          <code value=\"search-type\"/>\n        </interaction>\n        <searchParam>\n          <name value=\"_profile\"/>\n          <type value=\"string\"/>\n          <documentation value=\"An URL of profile in structured definition\"/>\n        </searchParam>\n        <searchParam>\n          <name value=\"_count\"/>\n          <type value=\"number\"/>\n          <documentation value=\"Maximum number of results to be returned\"/>\n        </searchParam>\n        <searchParam>\n          <name value=\"identifier\"/>\n          <type value=\"string\"/>\n          <documentation value=\"CoveragePlan identifier. It can be in the type of CloverHealth's identifier (E.g. 001, 002) or the plan ID (E.g. H5141)\"/>\n        </searchParam>\n        <searchParam>\n          <name value=\"status\"/>\n          <type value=\"string\"/>\n        </searchParam>\n        <searchParam>\n          <name value=\"item\"/>\n          <type value=\"string\"/>\n          <documentation value=\"The identifier of the associated FormularyDrug (also known as MedicationKnowledge) under the CoveragePlan\"/>\n        </searchParam>\n      </resource>\n      <resource>\n        <type value=\"MedicationKnowledge\"/>\n        <profile value=\"http://hl7.org/fhir/us/davinci-drug-formulary/StructureDefinition/usdf-FormularyDrug\"/>\n        <interaction>\n          <code value=\"read\"/>\n        </interaction>\n        <interaction>\n          <code value=\"search-type\"/>\n        </interaction>\n        <searchParam>\n          <name value=\"_profile\"/>\n          <type value=\"string\"/>\n          <documentation value=\"An URL of profile in structured definition\"/>\n        </searchParam>\n        <searchParam>\n          <name value=\"_count\"/>\n          <type value=\"number\"/>\n          <documentation value=\"Maximum number of results to be returned\"/>\n        </searchParam>\n        <searchParam>\n          <name value=\"DrugName\"/>\n          <type value=\"string\"/>\n          <documentation value=\"Name of the drug\"/>\n        </searchParam>\n        <searchParam>\n          <name value=\"DrugPlan\"/>\n          <type value=\"string\"/>\n          <documentation value=\"Plan of the drug\"/>\n        </searchParam>\n        <searchParam>\n          <name value=\"DrugTier\"/>\n          <type value=\"token\"/>\n          <documentation value=\"Drug tier of the drug\"/>\n        </searchParam>\n        <searchParam>\n          <name value=\"code\"/>\n          <type value=\"string\"/>\n          <documentation value=\"Rx code of the drug\"/>\n        </searchParam>\n      </resource>\n    </rest>\n  </CapabilityStatement>"
                  summary: XML Example
                  description: 'Any instance of data is allowed.


                    The API file specifies body for this request but it does not specify the data model.'
          description: ''
