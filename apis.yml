aid: clover-health
name: Clover Health
description: >-
  Clover Health is a Medicare Advantage health insurer that runs a public developer program
  built on healthcare interoperability standards. Its public FHIR R4 API exposes a Formulary
  service (covered drugs, tiers, and utilization management) and a Provider Directory service
  (practitioners, organizations, locations, healthcare services, and insurance plans), and a
  separate consent-based Patient Access API delivers a member's clinical and claims data in
  FHIR-native format via CareEvolution. The APIs implement the CMS Interoperability and Patient
  Access final rule (CMS-9115-F); Clover was the first payer to go live on a CMS-aligned/TEFCA
  network. Developers register for approved credentials and authenticate with HTTP Basic or a
  session cookie.
